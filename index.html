        traits: ['Rational', 'Studious', 'Strategic', 'Hands-on']
      },
      wenjin: {

// 题目分数映射（中英文通用）
const questionsScores = [
  [
    { tianquan: 2, kuanglan: 1 },
    { guyun: 2, qingxi: 1 },
    { jiuliu: 2, zuihuayin: 1 },
    { wumen: 2, wuxingu: 1 }
  ],
  [
    { sangeng: 2, tianquan: 1 },
    { wenjin: 2, moshandao: 1 },
    { liyuan: 2, qingxi: 1 },
    { zuihuayin: 2, jiuliu: 1 }
  ],
  [
    { tianquan: 2, kuanglan: 1 },
    { wumen: 2, guyun: 1 },
    { liyuan: 2, zuihuayin: 1 },
    { moshandao: 2, wenjin: 1 }
  ],
  [
    { tianquan: 2, qingxi: 1 },
    { jiuliu: 2, wenjin: 1 },
    { sangeng: 2, wuxingu: 1 },
    { liyuan: 2, zuihuayin: 1 }
  ],
  [
    { tianquan: 2, kuanglan: 1 },
    { sangeng: 2, guyun: 1 },
    { liyuan: 2, zuihuayin: 1 },
    { jiuliu: 2, wuxingu: 1 }
  ]
];

let currentLang = 'zh';
let currentQ = 0;
let totalScores = {};

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (lang === 'zh' && i === 0) || (lang === 'en' && i === 1));
  });
  updateUIText();
  // 如果在问题页，重新渲染当前问题
  if (!document.getElementById('questionPage').classList.contains('hidden')) {
    showQuestion();
  }
  // 如果在结果页，重新渲染结果
  if (!document.getElementById('resultPage').classList.contains('hidden')) {
    showResult(true);
  }
}

function updateUIText() {
  const t = i18n[currentLang];
  document.getElementById('mainTitle').textContent = t.title;
  document.getElementById('mainSubtitle').textContent = t.subtitle;
  document.getElementById('startTitle').textContent = t.startTitle;
  document.getElementById('startDesc').innerHTML = t.startDesc;
  document.getElementById('startBtn').textContent = t.startBtn;
  document.getElementById('restartBtn').textContent = t.restart;
  document.getElementById('footerText').innerHTML = t.footer;
  document.title = t.title + ' · Sect Test';
}

function startQuiz() {
  currentQ = 0;
  totalScores = {};
  document.getElementById('startPage').classList.add('hidden');
  document.getElementById('resultPage').classList.add('hidden');
  document.getElementById('questionPage').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  const t = i18n[currentLang];
  const q = t.questions[currentQ];
  document.getElementById('questionNum').textContent = `${t.questionPrefix} ${currentQ + 1} ${t.of} ${t.questions.length}${t.questionSuffix}`;
  document.getElementById('questionText').textContent = q.text;

  const optionsList = document.getElementById('optionsList');
  optionsList.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => selectOption(i);
    optionsList.appendChild(div);
  });

  updateProgress();
  const qPage = document.getElementById('questionPage');
  qPage.classList.remove('fade-in');
  void qPage.offsetWidth;
  qPage.classList.add('fade-in');
}

function selectOption(index) {
  const scores = questionsScores[currentQ][index];
  for (const [k, v] of Object.entries(scores)) {
    totalScores[k] = (totalScores[k] || 0) + v;
  }

  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.remove('selected');
    if (i === index) el.classList.add('selected');
  });

  setTimeout(() => {
    currentQ++;
    if (currentQ < questionsScores.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 300);
}

function updateProgress() {
  const pct = (currentQ / questionsScores.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

let lastResultKey = null;

function showResult(keepResult) {
  document.getElementById('questionPage').classList.add('hidden');
  document.getElementById('resultPage').classList.remove('hidden');

  let maxKey = lastResultKey;
  if (!keepResult) {
    maxKey = null;
    let maxScore = 0;
    for (const [k, v] of Object.entries(totalScores)) {
      if (v > maxScore) {
        maxScore = v;
        maxKey = k;
      }
    }
    lastResultKey = maxKey;
  }

  const sect = i18n[currentLang].sects[maxKey];
  const icons = {
    tianquan: '🛡️', kuanglan: '🗡️', sangeng: '🌙', jiuliu: '🎭',
    liyuan: '🌂', guyun: '☁️', qingxi: '🍃', zuihuayin: '🌸',
    moshandao: '⚙️', wenjin: '📜', wuxingu: '🦋', wumen: '🍃'
  };

  document.getElementById('resultIcon').textContent = icons[maxKey] || '⚔️';
  document.getElementById('resultName').textContent = sect.name;
  document.getElementById('resultTag').textContent = sect.tag;
  document.getElementById('resultDesc').textContent = sect.desc;

  const traitsEl = document.getElementById('resultTraits');
  traitsEl.innerHTML = '';
  sect.traits.forEach(t => {
    const span = document.createElement('span');
    span.className = 'trait-tag';
    span.textContent = t;
    traitsEl.appendChild(span);
  });

  updateProgress();

  const rPage = document.getElementById('resultPage');
  rPage.classList.remove('fade-in');
  void rPage.offsetWidth;
  rPage.classList.add('fade-in');
}

function restartQuiz() {
  lastResultKey = null;
  document.getElementById('resultPage').classList.add('hidden');
  document.getElementById('startPage').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '0%';
}

// 初始化
updateUIText();
</script>
